# Claudio en la Raspberry (nginx) → Mac mini.
#   claudio.hotwheelsandbids.com      → prod (Mac mini :3110)
#   claudio-dev.hotwheelsandbids.com  → dev  (Mac mini :3111)
#
# Acceso: desde la red de casa (192.168.0.0/24) entra sin login (el iPhone kiosco);
# desde fuera hace falta la sesión del home-portal (mismo auth_request que pihole.).
# Las reglas de acceso van dentro de `location /` y no a nivel de server para que
# certbot pueda validar /.well-known/acme-challenge/ por el puerto 80.
#
# Instalación: ver docs/servidor-pi.md. Certbot añade después las líneas de SSL.

upstream claudio_prod { server 192.168.0.215:3110; keepalive 4; }
upstream claudio_dev  { server 192.168.0.215:3111; keepalive 4; }

map $http_upgrade $claudio_connection {
    default upgrade;
    ''      '';
}

server {
    server_name claudio.hotwheelsandbids.com;
    listen 80;
    listen [::]:80;

    access_log /var/log/nginx/claudio.access.log;
    error_log  /var/log/nginx/claudio.error.log;

    location / {
        satisfy any;
        allow 192.168.0.0/24;
        deny all;
        auth_request /auth-check.php;
        error_page 401 = @login_redirect;

        proxy_pass http://claudio_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Para eventos en vivo (SSE) y websockets en fases siguientes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $claudio_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 20m;   # notas de voz, fotos…
    }

    location = /auth-check.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/deimos97/public_html/auth-check.php;
        fastcgi_param SCRIPT_NAME /auth-check.php;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    }

    location @login_redirect {
        return 302 https://hotwheelsandbids.com/login?redir_to=https://$host$request_uri;
    }
}

server {
    server_name claudio-dev.hotwheelsandbids.com;
    listen 80;
    listen [::]:80;

    access_log /var/log/nginx/claudio-dev.access.log;
    error_log  /var/log/nginx/claudio-dev.error.log;

    location / {
        satisfy any;
        allow 192.168.0.0/24;
        deny all;
        auth_request /auth-check.php;
        error_page 401 = @login_redirect;

        proxy_pass http://claudio_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $claudio_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 20m;
    }

    location = /auth-check.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/deimos97/public_html/auth-check.php;
        fastcgi_param SCRIPT_NAME /auth-check.php;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    }

    location @login_redirect {
        return 302 https://hotwheelsandbids.com/login?redir_to=https://$host$request_uri;
    }
}
